[package]
name = "patchwork"
version = "0.1.0"
description = "Patchwork: an infinite canvas for references and ideas"
authors = []
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "patchwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri-plugin-dialog = "2.8.1"
blake3 = "1.8.7"
rayon = "1.12.0"
fast_image_resize = "6.1.0"
rusqlite = { version = "0.40.2", features = ["bundled", "blob"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "rayon"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-notification = "2"
arboard = { version = "3.6", features = ["wayland-data-control"] }
getrandom = "0.3"
ah-asefile = "0.4.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "ogg", "vorbis", "wav", "aiff", "pcm", "adpcm", "mkv"] }

# Screenshots for the dev-only debug bridge. Versions match what Tauri already pulls in.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimized even in dev builds: decoding audio for waveforms and hashing big videos are
# far too slow unoptimized.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
