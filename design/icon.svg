<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6fd6"/>
      <stop offset="1" stop-color="#1546a0"/>
    </linearGradient>
    <pattern id="minor" width="41.2" height="41.2" patternUnits="userSpaceOnUse" x="100" y="100">
      <path d="M41.2 0H0V41.2" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2"/>
    </pattern>
    <pattern id="major" width="206" height="206" patternUnits="userSpaceOnUse" x="100" y="100">
      <path d="M206 0H0V206" fill="none" stroke="#fff" stroke-opacity="0.30" stroke-width="3"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0a2250" flood-opacity="0.55"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#major)"/>
  </g>
  <rect x="106" y="106" width="812" height="812" rx="180" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="4"/>
  <g filter="url(#sh)" stroke-linejoin="round">
    <!-- white patch behind -->
    <g transform="rotate(-7 440 450)">
      <rect x="200" y="210" width="480" height="480" rx="48" fill="#fff"/>
      <rect x="262" y="272" width="356" height="356" rx="20" fill="none" stroke="#1b57b8" stroke-width="16" stroke-dasharray="44 32" stroke-linecap="round"/>
    </g>
    <!-- yellow patch in front: the pop -->
    <g transform="rotate(6 600 600)">
      <rect x="400" y="400" width="420" height="420" rx="44" fill="#ffd23f" stroke="#fff" stroke-width="26"/>
      <rect x="458" y="458" width="304" height="304" rx="18" fill="none" stroke="#1546a0" stroke-width="16" stroke-dasharray="40 30" stroke-linecap="round"/>
    </g>
  </g>
</svg>
